    name="viewport"
    content="width=device-width, initial-scale=1"

  <title>
    The Observatory · Dashboard
  </title>
  <script>
    // The real Dashboard remains covered until the Tower-launched check-in completes.
    document.documentElement.classList.add("ob-entry-pending");
  </script>

  <script>
    /*
      OBUX091–095
      First-paint Observatory theme authority.
    */
    (function () {
      var key =
        "ob.appearance.theme.v2";

      var allowed = {
        "aurora-ink": true,
        "deep-field": true,
        "lunar-sage": true
      };

      var theme =
        "aurora-ink";

      try {
        var stored =
          window.localStorage
            .getItem(
              key
            );

        if (
          stored
          && allowed[stored]
        ) {
          theme = stored;
        }
      } catch (_) {}

      document
        .documentElement
        .setAttribute(
          "data-ob-theme",
          theme
        );
    })();
  </script>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='ob/ob_theme.css') }}"
  />

    rel="stylesheet"
    href="/static/ob/ob_interchangeable_themes.css?v=obux081085"

<body
  data-ob-data-desk-route-enabled="true"
  data-ob-room="dashboard"
  data-ob-surface="user-dashboard"
  data-ob-dashboard-role="normal"
  data-ob-owner-dashboard="false"
  data-ob-owner-console="false"
  data-ob-beta="true"
  data-ob-entry="checkin-carousel-then-dashboard"
  data-ob-build="OBUX091-095"
  data-ob-advisory-surface="self-directed-observation-and-paper"
  data-ob-owner-grade-candidates="false"
  data-ob-personalized-security-recommendations="false"
  data-ob-option-contract-recommendations="false"
  data-ob-live-recommendations="false"
  data-ob-live-auto-locked="true"
  data-ob-sop-version="beta-sop-v2"
  data-ob-whats-new-version="obux091-095-v1"
  data-ob-tower-return="/tower/return/observatory"
>
  <div
    class="ob-sky ob-user-sky"
    aria-hidden="true"
  >
    <div class="ob-sky__weather"></div>
    <div class="ob-sky__horizon"></div>
    <div class="ob-sky__grid"></div>
  </div>

  <div id="obArrivalRoot" aria-live="polite"></div>
  <div
    id="ob-app"
    class="ob-user-app"
  >
    <div
      class="ob-user-shell"
    >
      <header
        class="ob-user-header"
      >
        <div>
          <span
            class="ob-user-eyebrow"
          >
            THE OBSERVATORY · PRIVATE BETA
          </span>

          <h1>
            Dashboard
          </h1>

        </div>

        <div
          class="ob-user-boundary"
          aria-label="Dashboard mode boundary"
        >
          <span>
            Survey
          </span>

          <span>
            Paper
          </span>

          <span class="locked">
            Live Auto Locked
          </span>
        </div>
      </header>

      <main
        class="ob-user-dashboard"
      >
        <section
          class="ob-user-focus ob-user-focus-compact"
          aria-labelledby="obUserBriefingTitle"
        >
          <div class="ob-user-focus-copy">
            <span class="ob-kicker">SOULAANA</span>
            <h2 id="obUserBriefingTitle">Checking the market.</h2>
            <p id="obUserBriefingSummary">I’ll surface only what deserves your attention.</p>
            <div class="ob-user-focus-actions">
              <a class="ob-primary-action" href="/ob/market-map">Market Map</a>
              <a class="ob-secondary-action" href="/ob/trade-center">Practice</a>
            </div>
          </div>
        </section>

        <section
          class="ob-user-glance"
          aria-labelledby="obUserGlanceTitle"
        >
          <div
            class="ob-section-head"
          >
            <div>
              <span
                class="ob-kicker"
              >
                MARKET GLANCE
              </span>

              <h2
                id="obUserGlanceTitle"
              >
                Right now.
              </h2>
            </div>

            <a
              href="/ob/market-map"
            >
              Explore everything →
            </a>
          </div>

          <div
            id="obUserMarketGlance"
            class="ob-user-glance-grid"
          ></div>
        </section>

        <section
          class="ob-data-pulse"
          aria-labelledby="obDataPulseTitle"
        >
          <div class="ob-data-pulse-copy">
            <span class="ob-kicker">DATA PULSE</span>
            <h2 id="obDataPulseTitle">Sources at a glance.</h2>
          </div>

          <div
            id="obDataPulseChips"
            class="ob-data-pulse-chips"
            role="status"
            aria-live="polite"
          >
            <span class="ob-data-chip">Checking sources…</span>
          </div>

          <a
            class="ob-data-pulse-link"
            href="/ob/data-desk"
          >
            Market Data Desk →
          </a>
        </section>

      </main>
    </div>
  </div>
