<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>OB Review Center</title>

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='ob/ob_theme.css') }}"
  />

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='ob/ob_atmosphere.css') }}"
  />

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='ob/ob_review_center_obux.css') }}"
  />
  <link rel="stylesheet" href="/static/ob/ob_interchangeable_themes.css?v=obux061065" />
</head>

<body
  data-ob-room="review-center"
  data-ob-review-version="OBUX046-OBUX050"
>

  <div
    class="ob-sky"
    data-ob-atmosphere-version="OBUX026-OBUX030"
    aria-hidden="true"
  >
    <div class="ob-sky__weather"></div>
    <div class="ob-sky__horizon"></div>
    <div class="ob-sky__grid"></div>
  </div>

  <div id="ob-app">
    <div
      class="ob-v23-lock-marker"
      hidden
    >
      Live Auto Locked
    </div>

    <main class="obux-review-room">

      <header class="obux-review-room-header">
        <div>
          <span class="obux-review-room-path">
            OB://ReviewCenter
          </span>

          <h1>
            Review Center
          </h1>

          <p>
            Result truth · Process truth · Negative dive · Lessons
          </p>
        </div>

        <div class="obux-review-room-state">
          <span>
            PRIVATE
          </span>

          <span>
            LIVE AUTO LOCKED
          </span>
        </div>
      </header>


      <section
        id="reviewSummary"
        class="obux-review-summary"
      ></section>


      <nav
        class="obux-review-filters"
        aria-label="Review Center filters"
      >
        <button
          class="active"
          data-review-filter="attention"
        >
          Needs Review
        </button>

        <button
          data-review-filter="official"
        >
          Official
        </button>

        <button
          data-review-filter="manual_live"
        >
          Manual Live
        </button>

        <button
          data-review-filter="paper"
        >
          Paper
        </button>

        <button
          data-review-filter="practice"
        >
          Practice / Proof
        </button>

        <button
          data-review-filter="all"
        >
          All
        </button>
      </nav>


      <section class="obux-review-workspace">

        <aside class="obux-review-queue-panel">

          <div class="obux-review-panel-title">
            <span>
              Attention Queue
            </span>

            <strong>
              What needs me?
            </strong>
          </div>

          <div
            id="reviewQueue"
            class="obux-review-queue"
          ></div>

        </aside>


        <section
          id="reviewHero"
          class="obux-review-hero"
        >
          <div
            id="reviewLoading"
            class="obux-review-empty hero"
          >
            <strong>
              Loading canonical review truth…
            </strong>

            <span>
              No demo performance will be substituted.
            </span>
          </div>
        </section>

      </section>

    </main>
  </div>


  <!-- ============================================================================================
       CANONICAL / EXISTING OB SOURCES
       ============================================================================================ -->

  <script
    src="{{ url_for('static', filename='ob/ob_market_data.js') }}"
  ></script>

  <script
    src="{{ url_for('static', filename='ob/ob_data_contracts.js') }}"
  ></script>

  <script
    src="{{ url_for('static', filename='ob/ob_engine_feed_adapter.js') }}"
  ></script>

  <script
    src="{{ url_for('static', filename='ob/ob_snapshot_display.js') }}"
  ></script>

  <script
    src="{{ url_for('static', filename='ob/ob_mission_accounts.js') }}"
  ></script>

  <script
    src="{{ url_for('static', filename='ob/ob_receipts_review_foundation.js') }}"
  ></script>

  <script
    src="{{ url_for('static', filename='ob/ob_position_monitor_exit_close_capture.js') }}"
  ></script>

  <script
    src="{{ url_for('static', filename='ob/ob_final_trade_review_performance_receipt.js') }}"
  ></script>


  <!-- ============================================================================================
       DURABLE DRY-RUN / RECEIPT SOURCES
       ============================================================================================ -->

  <script
    src="{{ url_for('static', filename='ob/ob_manual_live_dry_run_outcome_finalization.js') }}"
  ></script>

  <script
    src="{{ url_for('static', filename='ob/ob_manual_live_outcome_receipt_materialization.js') }}"
  ></script>


  <!-- ============================================================================================
       OBUX046–050 CANONICAL REVIEW CENTER
       ============================================================================================ -->

  <script
    src="{{ url_for('static', filename='ob/ob_review_center_projection.js') }}"
  ></script>

  <script
    src="{{ url_for('static', filename='ob/ob_review_center.js') }}"
  ></script>


  <!-- Shared protected-room shell -->
  <script
    src="{{ url_for('static', filename='ob/ob_nav_shell.js') }}"
  ></script>

  <script
    src="{{ url_for('static', filename='ob/ob_notifications_settings.js') }}"
  ></script>

<script src="/static/ob/ob_session_state.js"></script>
<script src="/static/ob/ob_global_session_shell.js"></script>
  <script src="/static/ob/ob_theme_switcher.js?v=obux061065"></script>
  <script src="/static/ob/ob_beta_surface_cleanup.js?v=obux061065"></script>
</body>
</html>
