  <script>
    /*
      OBUX091–095
      Owner Dashboard first-paint theme authority.
    */
    (function () {
      var key =
        "ob.appearance.theme.v2";

      var allowed = {
        "aurora-ink": true,
        "deep-field": true,
        "lunar-sage": true
      };

      var theme =
        "aurora-ink";

      try {
        var stored =
          window.localStorage
            .getItem(
              key
            );

        if (
          stored
          && allowed[stored]
        ) {
          theme = stored;
        }
      } catch (_) {}

      document
        .documentElement
        .setAttribute(
          "data-ob-theme",
          theme
        );
    })();
  </script>

  <script src="/static/ob/ob_product_surface_policy.js?v=obux086090"></script>
