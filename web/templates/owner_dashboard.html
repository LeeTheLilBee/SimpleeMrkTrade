<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OB Owner Dashboard</title>

  <!--
    OBUX025_DORMANT_OWNER_DASHBOARD
    OWNER_DASHBOARD_ACTIVATION_HANDOFF

    NORMAL DASHBOARD:
      everyday Observatory intelligence

    OWNER DASHBOARD:
      additional Solice-only strategic Observatory intelligence

    OWNER CONSOLE:
      deep administration / diagnostics / controls

    IMPORTANT:
      This template does not create or authorize a route.
      Tower doorway work is deliberately separate.
  -->

  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='ob/ob_theme.css') }}"
  />
  <link
    rel="stylesheet"
    href="{{ url_for('static', filename='ob/ob_owner_dashboard.css') }}"
  />
<link rel="stylesheet" href="{{ url_for('static', filename='ob/ob_atmosphere.css') }}" />
</head>

<body
  data-ob-owner-dashboard-role="owner-only-active"
  data-ob-owner-dashboard-route-state="tower-protected-active"
  data-ob-owner-dashboard-design-activated="true"
  data-ob-live-auto-locked="true" data-ob-room="owner-dashboard">
<div
  class="ob-sky"
  data-ob-atmosphere-version="OBUX026-OBUX030"
  aria-hidden="true"
>
  <div class="ob-sky__weather"></div>
  <div class="ob-sky__horizon"></div>
  <div class="ob-sky__grid"></div>
</div>

  <div id="ob-owner-dashboard-app">
    <div class="ob-owner-shell">
      <header class="ob-owner-shell-header">
        <div class="ob-owner-shell-title">
          <strong>The Observatory · Owner Dashboard</strong>
          <span>
            additional owner intelligence · not Owner Console
          </span>
        </div>

        <div class="ob-owner-shell-status">
          <span class="ob-owner-chip owner">Owner only</span>
          <span class="ob-owner-chip owner">Tower Protected</span>
          <span class="ob-owner-chip locked">Live Auto Locked</span>
        </div>
      </header>

      <div id="ownerDashboardMount"></div>
    </div>
  </div>

  <!--
    Do NOT load the legacy Owner Console panel stack here.
    Owner Dashboard fetches read-only JSON intelligence through its
    own guarded contract instead of rendering the diagnostic walls.
  -->

  <script
    src="{{ url_for('static', filename='ob/ob_owner_dashboard_contract.js') }}"
  ></script>
  <script
    src="{{ url_for('static', filename='ob/ob_owner_dashboard_soulaana.js') }}"
  ></script>
  <script
    src="{{ url_for('static', filename='ob/ob_owner_dashboard.js') }}"
  ></script>
</body>
</html>
