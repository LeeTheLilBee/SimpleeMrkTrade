name: Tower BuyBox owner/action contracts TWR202-206

on:
  push:
    branches:
      - tower-buybox-owner-preflight-contract-twr202-206
  pull_request:
    paths:
      - 'tower/buybox_*'
      - 'tests/test_tower_buybox_*'
      - 'docs/TOWER_BUYBOX_OWNER_ACTION_TWR202_206.md'
      - '.github/workflows/tower-buybox-owner-action-twr202-206.yml'

permissions:
  contents: read

jobs:
  owner-action-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hosted and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r deploy/hosted_tower/requirements.txt pytest
      - name: Check BuyBox action contract, registry and authoritative truth
        run: |
          python -m pytest -q \
            tests/test_tower_buybox_action_contract_twr202_206.py \
            tests/test_tower_buybox_registry_boundary_twr201.py \
            tests/test_tower_app_registry_security_map.py \
            tests/test_tower_authoritative_truth_contract_twr121_125.py \
            tests/test_tower_authoritative_app_publication_availability_twr141_145.py
