name: Tower OBML011-015 exact OB namespace source verification

on:
  push:
    branches:
      - tower-obml-account-source-verifier-twr-obml011-015
  pull_request:
    branches:
      - tower-hosted-runtime-identity-twr081-085
    paths:
      - 'tower/obml_account_identity_source_verifier.py'
      - 'tests/test_tower_obml_account_identity_source_verifier_twr011_015.py'
      - 'docs/TOWER_OBML_ACCOUNT_SOURCE_VERIFIER_TWR011_015.md'
      - '.github/workflows/tower-obml-account-source-verifier.yml'

permissions:
  contents: read

jobs:
  independent-ob-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin independently developed OB account source exporter
        uses: actions/checkout@v4
        with:
          repository: LeeTheLilBee/SimpleeMrkTrade
          ref: d3383a0e81ce94b484420b860d7f16e9ef96d98f
          path: obai-source
          persist-credentials: false
      - name: Pin original OBML Tower request
        uses: actions/checkout@v4
        with:
          repository: LeeTheLilBee/SimpleeMrkTrade
          ref: badef7fab30f93be6878d89b28f4863cfa6fc202
          path: obml-request-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tower runtime and test dependencies
        run: python -m pip install -r deploy/hosted_tower/requirements.txt pytest
      - name: Exact exporter, replay, preflight and registry regressions
        run: |
          python -m pytest -q \
            tests/test_tower_obml_account_identity_source_verifier_twr011_015.py \
            tests/test_tower_obml_owner_review_preflight_twr_obml006_010.py \
            tests/test_tower_app_registry_security_map.py
