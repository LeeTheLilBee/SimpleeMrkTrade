name: OBSIM081-085 anonymous owner-final evidence denial
on:
  push:
    branches:
      - 'obsim081-085-*'
  pull_request:
    branches:
      - 'tower-hosted-runtime-identity-twr081-085'
    paths:
      - 'scripts/ob_hosted_anonymous_release_probe.py'
      - 'scripts/ob_anonymous_two_host_inventory.py'
      - 'tests/test_obsim066_070_anonymous_release_probe.py'
      - 'tests/test_obsim081_085_anonymous_final_evidence_denial.py'
      - '.github/workflows/obsim081-085-anonymous-evidence-denial.yml'
permissions:
  contents: read
jobs:
  anonymous-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Existing test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Syntax and isolated public negative tests
        run: |
          python -m py_compile scripts/ob_hosted_anonymous_release_probe.py scripts/ob_anonymous_two_host_inventory.py tests/test_obsim081_085_anonymous_final_evidence_denial.py
          python -m pytest -q tests/test_obsim066_070_anonymous_release_probe.py tests/test_obsim071_075_two_host_anonymous_inventory.py tests/test_obsim081_085_anonymous_final_evidence_denial.py tests/test_obsim076_080_owner_final_evidence_export.py tests/test_tower_ob_web_route_enforcement.py
