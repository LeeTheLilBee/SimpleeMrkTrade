name: OBSIM021-025 atomic private owner report archive
on:
  push:
    branches: [obsim021-025-local-report-no-clobber]
  pull_request:
    paths:
      - 'web/ob_on_demand_simulation_session.py'
      - 'tests/test_obsim021_025_local_report_no_clobber.py'
      - 'docs/owner_experience/OBSIM021-025_LOCAL_ARCHIVE_SAFETY.md'
      - '.github/workflows/obsim021-025-local-archive-safety.yml'
permissions:
  contents: read
jobs:
  owner-local-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest tzdata flask requests yfinance
      - run: python -m pytest -q tests/test_obsim021_025_local_report_no_clobber.py tests/test_obsim016_020_on_demand_session.py tests/test_obsim001_005_multi_simulation_harness.py tests/test_obsim006_010_deterministic_replay.py tests/test_obsim011_015_adverse_scenario_regressions.py
