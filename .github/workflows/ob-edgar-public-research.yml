name: OB SEC EDGAR read-only collector
on:
  push:
    branches:
      - ob-edgar-public-owner-research-20260929
  pull_request:
    paths:
      - 'engine/market_intake/sec_public_*.py'
      - 'scripts/ob_edgar_public_probe.py'
      - 'tests/test_ob_edgar_public_research.py'
      - 'docs/market_data/OB_EDGAR_PUBLIC_OWNER_GUIDE.md'
      - '.github/workflows/ob-edgar-public-research.yml'
permissions:
  contents: read
jobs:
  offline-sec-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Dependencies
        run: python -m pip install -r deploy/hosted_tower/requirements.txt 'pytest>=8,<10'
      - name: Compile and run offline contract regressions
        run: |
          python -m py_compile engine/market_intake/sec_public_client.py engine/market_intake/sec_public_research.py scripts/ob_edgar_public_probe.py
          python -m pytest -q tests/test_ob_edgar_public_research.py tests/test_obintel001_030_symbol_research.py tests/test_obscan001_025_sovereign_intake.py
      - name: No automatic hosted activation or broker path
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [Path("engine/market_intake/sec_public_client.py"), Path("engine/market_intake/sec_public_research.py"), Path("scripts/ob_edgar_public_probe.py")]
          content = "\n".join(p.read_text() for p in files)
          assert "broker_submit_order" not in content
          assert "api.github.com" not in content
          assert "render_secret" not in content
          host = Path("web/hosted_tower.py").read_text()
          assert "sec_public_client" not in host
          assert "sec_public_research" not in host
          print("Offline-only SEC collector: no hosted registration.")
          PY
