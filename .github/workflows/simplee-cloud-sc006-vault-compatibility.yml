name: Simplee Cloud SC006 merged Vault protocol and release readiness

on:
  push:
    branches:
      - simplee-cloud-sc006-vault-compatibility-readiness
  # Historical specialist check: full package PR regression is consolidated.
  pull_request:
    paths:
      - '.github/workflows/simplee-cloud-sc006-vault-compatibility.yml'
      - 'docs/SIMPLEE_SOVEREIGN_CLOUD_SC006_MERGED_SOURCE_READINESS.md'
      - 'vault/real_operations_encrypted_storage.py'
      - 'vault/real_operations_managed_object_store.py'

permissions:
  contents: read

jobs:
  synthetic-vault-cloud-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only source-test dependencies
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - name: Compile exact independent Cloud package and merged Vault envelope
        run: |
          python -m compileall -q simplee_cloud
          python -m py_compile vault/real_operations_encrypted_storage.py vault/real_operations_managed_object_store.py
      - name: Run full source-only Cloud and merged Vault envelope compatibility tests
        run: python -m pytest -q simplee_cloud/tests/
