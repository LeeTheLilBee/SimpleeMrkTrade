name: OBML021-025 owner first-live lifecycle and independent HOLD
on:
  push:
    branches:
      - 'obml021-025-*'
  pull_request:
    branches:
      - main
    paths:
      - 'web/ob_manual_live_l1_phase_contract.py'
      - 'tests/test_obml021_025_owner_first_live_lifecycle.py'
      - 'docs/owner_experience/OBML021_025_FIRST_OWNER_LIVE_LIFECYCLE.md'
      - '.github/workflows/obml021-025-owner-first-live.yml'
permissions:
  contents: read
jobs:
  noncircular-and-failclosed:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing regression dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Source-only first live phase, upstream OBML and owner beta safety
        run: |
          python -m py_compile web/ob_manual_live_l1_phase_contract.py
          python -m pytest -q tests/test_obml021_025_owner_first_live_lifecycle.py tests/test_obml001_005_owner_manual_source_preflight.py tests/test_obml006_010_tower_contract_inspection.py tests/test_obml011_015_owner_beta_gate_report.py tests/test_obml016_020_tower_namespace_cross_check.py tests/test_obbeta001_005_owner_tester_truth.py tests/test_obbeta006_010_owner_readiness_truth.py
      - name: Complete accepted main repo tests
        run: python -m pytest -q tests
