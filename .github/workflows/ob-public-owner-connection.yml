name: OB Public protected owner connection (offline)
on:
  push:
    branches:
      - tower-ob-public-owner-connect-ui-0929
  pull_request:
    paths:
      - 'tower/ob_public_owner_connection.py'
      - 'tower/ob_market_data_desk_integration.py'
      - 'tower/ob_web_route_enforcement.py'
      - 'tower/ob_route_guard.py'
      - 'web/templates/ob_public_owner_connection.html'
      - 'web/templates/market_data_desk.html'
      - 'web/static/ob/ob_public_owner_connection.css'
      - 'tests/test_ob_public_owner_connection.py'
      - '.github/workflows/ob-public-owner-connection.yml'
jobs:
  source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest flask
      - run: python -m compileall -q tower/ob_public_owner_connection.py engine/market_intake/public_quote_readonly.py
      - run: python -m pytest -q tests/test_ob_public_owner_connection.py tests/test_ob_public_local_probe.py tests/test_public_quote_readonly.py tests/test_tower_ob_market_data_desk_selective.py tests/test_tower_ob_web_route_enforcement.py
      - name: No provider orders, persistent secret or public route
        run: |
          ! grep -E 'place_order|submit_order|order/preflight|api_key.*session|session.*secret_key' tower/ob_public_owner_connection.py
