name: BuyBox post-close source proposal BBX052-056
on:
  push:
    branches: [buybox-postclose-source-handoff-bbx052-056]
  pull_request:
    paths:
      - 'buybox/post_close_handoff_proposal.py'
      - 'buybox/tests/test_post_close_handoff_proposal.py'
      - 'docs/BUYBOX_POST_CLOSE_PROPOSAL_BBX052_056.md'
      - '.github/workflows/buybox-postclose-proposal-bbx052-056.yml'
permissions:
  contents: read
jobs:
  no-operational-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r buybox/requirements.txt
      - run: python -m unittest discover -s buybox/tests -p 'test_post_close_handoff_proposal.py' -v
