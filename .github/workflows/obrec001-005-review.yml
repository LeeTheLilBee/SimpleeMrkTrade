name: OBREC001-005 safety-bound owner recommendation
on:
  push:
    branches:
      - 'obrec001-005-*'
  pull_request:
    paths:
      - 'web/ob_recommendation_review.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obrec001_005_owner_recommendation_review.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - '.github/workflows/obrec001-005-review.yml'
permissions:
  contents: read
jobs:
  recommendation-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Syntax and focused source-bound recommendation
        run: |
          python -m py_compile web/ob_recommendation_review.py tests/test_obrec001_005_owner_recommendation_review.py
          python -m pytest -q tests/test_obrec001_005_owner_recommendation_review.py tests/test_obsafe001_005_bound_source_review.py tests/test_obstrat001_005_source_bound_strategy_review.py tests/test_obauth001_005_canonical_authority_registry.py
      - name: Full repository regression
        run: python -m pytest -q tests
