name: Tower Public route clearance regression
on:
  push:
    branches:
      - tower-ob-public-clearance-map-fix-0929
  pull_request:
    paths:
      - 'tower/ob_clearance_bridge.py'
      - 'tests/test_tower_ob_public_clearance_policy.py'
      - '.github/workflows/tower-ob-public-clearance-fix.yml'
jobs:
  exact-owner-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest flask
      - run: python -m pytest -q tests/test_tower_ob_public_clearance_policy.py tests/test_ob_public_owner_connection.py tests/test_tower_ob_market_data_desk_selective.py
