name: Tower Python 3.11 source syntax seal TWR-TEST006-010

on:
  push:
    branches:
      - tower-ob-mode-py311-syntax-twrtest006-010
  pull_request:
    branches:
      - tower-hosted-runtime-identity-twr081-085
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-and-mode-default-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact OBML request for existing preflight regression
        uses: actions/checkout@v4
        with:
          repository: LeeTheLilBee/SimpleeMrkTrade
          ref: badef7fab30f93be6878d89b28f4863cfa6fc202
          path: obml-request-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hosted Tower dependencies and pytest
        run: |
          python -m pip install -r deploy/hosted_tower/requirements.txt pytest
      - name: Compile Tower and hosted web modules under Python 3.11
        run: |
          python -m compileall -q tower web
      - name: Run mode behavior and default-deny regressions
        run: |
          python -m pytest -q \
            tests/test_tower_ob_mode_clearance_py311_twrtest006_010.py \
            tests/test_tower_app_registry_security_map.py \
            tests/test_tower_obml_owner_review_preflight_twr_obml006_010.py
