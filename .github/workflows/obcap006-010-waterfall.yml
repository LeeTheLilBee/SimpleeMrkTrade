name: OBCAP006-010 guarded capital waterfall
on:
  push:
    branches:
      - 'obcap006-010-*'
    paths:
      - 'web/ob_capital_waterfall.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obcap006_010_guarded_capital_waterfall.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - '.github/workflows/obcap006-010-waterfall.yml'
  pull_request:
    paths:
      - 'web/ob_capital_waterfall.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obcap006_010_guarded_capital_waterfall.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - '.github/workflows/obcap006-010-waterfall.yml'
permissions:
  contents: read
jobs:
  guarded-waterfall:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Syntax and import boundary wall
        run: python -m py_compile web/ob_capital_waterfall.py tests/test_obcap006_010_guarded_capital_waterfall.py
      - name: Focused waterfall and registry tests
        run: |
          python -m pytest -q \
            tests/test_obcap001_005_source_bound_capital_truth.py \
            tests/test_obcap006_010_guarded_capital_waterfall.py \
            tests/test_obauth001_005_canonical_authority_registry.py \
            tests/test_obevent001_010_command_event_causal.py
      - name: Full repository regression
        run: python -m pytest -q tests
