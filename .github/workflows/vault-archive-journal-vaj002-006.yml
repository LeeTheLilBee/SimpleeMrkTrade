name: Vault archival journal negative source CI VAJ002-006
on:
  push:
    branches: [vault-archive-journal-regression-vaj002-006, vault-archive-transaction-state-v1]
  pull_request:
    paths:
      - 'vault/archival_transaction_journal.py'
      - 'vault/test_archival_transaction_journal*.py'
      - 'docs/VAULT_ARCHIVAL_JOURNAL_TESTS_VAJ002_006.md'
      - '.github/workflows/vault-archive-journal-vaj002-006.yml'
permissions:
  contents: read
jobs:
  source-only-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest
      - run: python -m pytest -q vault/test_archival_transaction_journal.py vault/test_archival_transaction_journal_security.py
