name: Clouds Renderer Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - clouds-live-owner-command-finish

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deploy/hosted_tower/requirements.txt
      - name: Render owner command directly
        run: |
          python - <<'PY'
          from web.hosted_tower import app
          from tower.clouds_live_owner_command import render_owner_command

          def page_factory(*, title, body):
              return "<html><title>" + title + "</title><body>" + body + "</body></html>"

          print("AFTER_REQUEST_FUNCTIONS", [
              getattr(fn, "__name__", str(fn))
              for fn in app.after_request_funcs.get(None, [])
              if "cloud" in getattr(fn, "__name__", "").lower()
          ])
          print("MOUNT_EXTENSION", app.extensions.get(
              "clouds_live_owner_command_hosted_mount_20261001"
          ))

          with app.test_request_context("/clouds"):
              html = render_owner_command(
                  page_factory=page_factory,
                  clouds_return_path="/tower/return/clouds",
              )
              print("RENDER_OK", len(html))
              print("HAS_NEEDS_YOU", "Needs You" in html)
              print("HAS_LINES", "Ecosystem Lines" in html)
          PY
