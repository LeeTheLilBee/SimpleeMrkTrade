name: TWR OBML local atomic source-nonce callback
on:
  push:
    branches:
      - 'twr-obml-local-atomic-source-nonce-ledger'
  pull_request:
    paths:
      - 'tower/obml_local_source_nonce_ledger.py'
      - 'tests/test_tower_obml_local_atomic_nonce_ledger.py'
      - 'docs/TOWER_OBML_LOCAL_SOURCE_NONCE_LEDGER_HANDOFF.md'
      - '.github/workflows/tower-obml-local-source-nonce-ledger.yml'
permissions:
  contents: read
jobs:
  local-nonce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Syntax and local callback/source production test
        run: |
          python -m py_compile tower/obml_local_source_nonce_ledger.py tests/test_tower_obml_local_atomic_nonce_ledger.py
          python -m pytest -q tests/test_tower_obml_local_atomic_nonce_ledger.py tests/test_obml_tower_account_namespace_interop.py tests/test_tower_obml_account_namespace_source.py tests/test_obml011_015_account_identity_export.py
      - name: Full repository regression
        run: python -m pytest -q tests
