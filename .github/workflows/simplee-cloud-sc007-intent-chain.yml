name: Simplee Cloud SC007 reservation-chain source proof

on:
  push:
    branches:
      - simplee-cloud-sc007-intent-chain-binding
  # Historical specialist check: full package PR regression is consolidated.
  pull_request:
    paths:
      - '.github/workflows/simplee-cloud-sc007-intent-chain.yml'
      - 'docs/SIMPLEE_SOVEREIGN_CLOUD_SC007_INTENT_CHAIN.md'

permissions:
  contents: read

jobs:
  source-reservation-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic test dependencies
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - name: Compile Cloud and merged Vault envelope
        run: |
          python -m compileall -q simplee_cloud
          python -m py_compile vault/real_operations_encrypted_storage.py
      - name: Run full synthetic Cloud source regression
        run: python -m pytest -q simplee_cloud/tests/
      - name: Publish default-off owner preflight
        if: always()
        run: python -m simplee_cloud.owner_preflight >> "$GITHUB_STEP_SUMMARY"
