name: Simplee Cloud SC008 actual Vault journal and canonical registry acceptance

on:
  push:
    branches:
      - simplee-cloud-sc008-vault-canonical-acceptance
  # Historical specialist check: full package PR regression is consolidated.
  pull_request:
    paths:
      - '.github/workflows/simplee-cloud-sc008-vault-finalization.yml'
      - 'docs/SIMPLEE_SOVEREIGN_CLOUD_SC008_VAULT_ACCEPTANCE.md'
      - 'vault/archival_transaction_journal.py'
      - 'vault/canonical_evidence_registry.py'
      - 'vault/real_operations_encrypted_storage.py'

permissions:
  contents: read

jobs:
  actual-vault-cloud-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies only
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - name: Compile Cloud and merged Vault source modules
        run: |
          python -m compileall -q simplee_cloud
          python -m py_compile vault/archival_transaction_journal.py vault/canonical_evidence_registry.py vault/real_operations_encrypted_storage.py
      - name: Run full Cloud source plus actual Vault archival/registry acceptance
        run: |
          python -m pytest -q simplee_cloud/tests/             vault/test_archival_transaction_journal.py             vault/test_archival_transaction_journal_security.py             vault/test_canonical_evidence_registry.py             vault/test_local_archival_integration.py             vault/test_real_operations_encrypted_storage.py
      - name: Publish source-only owner preflight
        if: always()
        run: python -m simplee_cloud.owner_preflight >> "$GITHUB_STEP_SUMMARY"
