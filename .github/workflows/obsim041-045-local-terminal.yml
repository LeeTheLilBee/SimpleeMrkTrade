name: OBSIM041-045 active local owner terminal rehearsal
on:
  push:
    branches:
      - 'obsim041-045-*'
  pull_request:
    branches:
      - 'obsim016-020-free-on-demand-session'
    paths:
      - 'scripts/ob_local_owner_rehearsal.py'
      - 'examples/obsim_owner_synthetic_hold_example.json'
      - 'tests/test_obsim041_045_local_terminal_owner_rehearsal.py'
      - '.github/workflows/obsim041-045-local-terminal.yml'
permissions:
  contents: read
jobs:
  owner-local-active-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest tzdata flask requests yfinance
      - name: Source compilation, sample parsing, local owner/source regressions
        run: |
          python -m py_compile scripts/ob_local_owner_rehearsal.py tests/test_obsim041_045_local_terminal_owner_rehearsal.py
          python -m json.tool examples/obsim_owner_synthetic_hold_example.json > /dev/null
          python -m pytest -q tests/test_obsim041_045_local_terminal_owner_rehearsal.py tests/test_obsim036_040_explicit_owner_rehearsal_input.py tests/test_obsim031_035_private_archive_read_verification.py tests/test_obsim026_030_source_freshness_and_owner_due.py tests/test_obsim016_020_on_demand_session.py
      - name: Complete repository regression
        run: python -m pytest -q tests
