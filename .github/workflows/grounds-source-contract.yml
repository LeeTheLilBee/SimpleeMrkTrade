name: Grounds source-only contract
on:
  pull_request:
    paths:
      - 'grounds/**'
      - 'docs/THE_GROUNDS_RECOVERED_PLAN_GRD001_005.md'
      - 'docs/THE_GROUNDS_IMPLEMENTATION_GRD006_019.md'
      - 'docs/THE_GROUNDS_STEWARDSHIP_GRD024_033.md'
      - '.github/workflows/grounds-source-contract.yml'
  push:
    branches:
      - 'grounds-resident-operations-grd001-005'
    paths:
      - 'grounds/**'
      - 'docs/THE_GROUNDS_RECOVERED_PLAN_GRD001_005.md'
      - '.github/workflows/grounds-source-contract.yml'
jobs:
  source-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Compile source-only Grounds
        run: python -m compileall -q grounds
      - name: Run full Grounds domain and boundary tests
        run: python -m unittest discover -s grounds -p 'test_*.py' -v
