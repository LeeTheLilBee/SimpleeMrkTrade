name: OBSCAN001–025 sovereign intake source-only
on:
  push:
    branches:
      - obscan001-025-sovereign-intake-zero-cost
  pull_request:
    branches:
      - main
    paths:
      - 'engine/market_intake/**'
      - 'tests/test_obscan001_025_sovereign_intake.py'
      - 'tests/test_obscan_public_edgar_fetch.py'
      - 'scripts/obscan_public_edgar_fetch.py'
      - 'docs/market_data/OBSCAN001_025_SOVEREIGN_INTAKE.md'
      - '.github/workflows/obscan001-025-source-only.yml'
permissions:
  contents: read
jobs:
  offline-intake-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runner only (no paid providers)
        run: python -m pip install pytest
      - name: Compile all new scanner modules
        run: python -m compileall -q engine/market_intake scripts/obscan_public_edgar_fetch.py
      - name: Test source entitlement, timestamp, issuer and traffic safety
        run: python -m pytest -q tests/test_obscan001_025_sovereign_intake.py tests/test_obscan_public_edgar_fetch.py
      - name: Confirm no network, broker or hosted app imports added in new scanner
        run: |
          python - <<'PY'
          from pathlib import Path
          sources = "\n".join(p.read_text() for p in Path("engine/market_intake").glob("*.py"))
          forbidden = ["import requests", "import yfinance", "import aiohttp", "from urllib.request", "from ib_insync",
                       "place_order(", "submit_order(", "Render API", "web.app import", "requests.get(", "urllib.request.urlopen("]
          violations=[value for value in forbidden if value in sources]
          if violations:
              raise SystemExit(f"Unsafe transport introduced: {violations}")
          print("Network / broker / hosting transport boundary intact")
          PY
