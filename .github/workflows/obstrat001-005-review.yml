name: OBSTRAT001-005 explicit strategy review
on:
  push:
    branches:
      - 'obstrat001-005-*'
  pull_request:
    paths:
      - 'web/ob_strategy_review.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obstrat001_005_source_bound_strategy_review.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - '.github/workflows/obstrat001-005-review.yml'
permissions:
  contents: read
jobs:
  explicit-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Syntax and focused strategy review
        run: |
          python -m py_compile web/ob_strategy_review.py tests/test_obstrat001_005_source_bound_strategy_review.py
          python -m pytest -q tests/test_obstrat001_005_source_bound_strategy_review.py tests/test_obport001_005_source_bound_lane_portfolio.py tests/test_obpos001_005_source_bound_position_view.py tests/test_obauth001_005_canonical_authority_registry.py
      - name: Full repository regression
        run: python -m pytest -q tests
