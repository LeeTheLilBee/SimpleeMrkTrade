name: BuyBox hosted Tower boundary BBX011-015

on:
  push:
    branches:
      - buybox-hosted-boundary-bbx011-015
  pull_request:
    paths:
      - 'buybox/**'
      - '.github/workflows/buybox-hosted-boundary.yml'

permissions:
  contents: read

jobs:
  hosted-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BuyBox dependencies
        run: python -m pip install -r buybox/requirements.txt
      - name: Checkout exact PR35 metadata schema
        uses: actions/checkout@v4
        with:
          ref: 1b9a3e191cf8f8b61adb59b790033983f767f42f
          path: upstream-proof
          persist-credentials: false
      - name: Full BuyBox regression + hosted protocol
        env:
          BUYBOX_CANONICAL_CONTRACT_PATH: upstream-proof/vault/buybox_evidence_handoff_contract.py
        run: python -m unittest discover -s buybox/tests -v
