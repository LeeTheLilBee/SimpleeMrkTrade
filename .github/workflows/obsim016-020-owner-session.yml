name: OBSIM016-020 owner on-demand simulation session
on:
  push:
    branches:
      - 'obsim016-020-*'
    paths:
      - 'web/ob_on_demand_simulation_session.py'
      - 'tests/test_obsim016_020_on_demand_session.py'
      - '.github/workflows/obsim016-020-owner-session.yml'
  pull_request:
    paths:
      - 'web/ob_on_demand_simulation_session.py'
      - 'tests/test_obsim016_020_on_demand_session.py'
      - '.github/workflows/obsim016-020-owner-session.yml'
permissions:
  contents: read
jobs:
  owner-session:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Compile boundary and tests
        run: python -m py_compile web/ob_on_demand_simulation_session.py tests/test_obsim016_020_on_demand_session.py
      - name: Focused owner session and accepted replay regressions
        run: |
          python -m pytest -q \
            tests/test_obsim016_020_on_demand_session.py \
            tests/test_obsim001_005_multi_simulation_harness.py \
            tests/test_obsim006_010_deterministic_replay.py \
            tests/test_obsim011_015_adverse_scenario_regressions.py
