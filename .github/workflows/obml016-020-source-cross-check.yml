name: OBML016-020 Tower source namespace cross-check
on:
  push:
    branches:
      - 'obml016-020-*'
  pull_request:
    paths:
      - 'web/ob_manual_live_namespace_cross_check.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obml016_020_tower_namespace_cross_check.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - '.github/workflows/obml016-020-source-cross-check.yml'
permissions:
  contents: read
jobs:
  source-correlation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Source and receiver focused regression
        run: |
          python -m py_compile web/ob_manual_live_namespace_cross_check.py tests/test_obml016_020_tower_namespace_cross_check.py
          python -m pytest -q tests/test_obml016_020_tower_namespace_cross_check.py tests/test_tower_obml_local_atomic_nonce_ledger.py tests/test_obml_tower_account_namespace_interop.py tests/test_obml011_015_owner_beta_gate_report.py tests/test_obauth001_005_canonical_authority_registry.py
      - name: Full repository regression
        run: python -m pytest -q tests
