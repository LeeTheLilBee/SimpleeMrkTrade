name: Simplee Sovereign Cloud SC001 source checks

on:
  push:
    branches:
      - simplee-cloud-sovereign-foundation-sc001
  # Historical specialist check: full package PR regression is consolidated.
  pull_request:
    paths:
      - '.github/workflows/simplee-sovereign-cloud-sc001.yml'
      - 'docs/SIMPLEE_SOVEREIGN_CLOUD_SC001_HANDOFF.md'

permissions:
  contents: read

jobs:
  bounded-source-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependencies
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - name: Compile exact independent Cloud scope
        run: |
          python -m py_compile simplee_cloud/__init__.py simplee_cloud/contracts.py simplee_cloud/local_backend.py simplee_cloud/service.py simplee_cloud/backup.py simplee_cloud/tests/test_sc001_storage.py simplee_cloud/tests/test_sc001_backup.py
      - name: Run synthetic storage and isolated recovery tests
        run: python -m pytest -q simplee_cloud/tests/test_sc001_storage.py simplee_cloud/tests/test_sc001_backup.py
