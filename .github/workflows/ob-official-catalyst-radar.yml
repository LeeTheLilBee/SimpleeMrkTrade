name: OB official Catalyst Radar and Soulaana source seals

on:
  pull_request:
    branches:
      - tower-hosted-runtime-identity-twr081-085
    paths:
      - "engine/market_intake/official_catalyst_sources.py"
      - "engine/market_intake/official_catalyst_radar.py"
      - "engine/market_intake/official_catalyst_intelligence.py"
      - "engine/market_intake/official_catalyst_fingerprint.py"
      - "engine/market_intake/observatory_event_stream.py"
      - "engine/market_intake/observatory_grpc_contract.py"
      - "proto/observatory_event_v1.proto"
      - "web/ob_event_trace_route.py"
      - "web/static/ob/ob_event_trace.js"
      - "tests/test_ob_observatory_grpc_contract.py"
      - "tests/test_ob_event_trace_route.py"
      - "tests/test_tower_ob_keyed_provider_research.py"
      - "web/ob_official_catalyst_route.py"
      - "web/ob_event_websocket.py"
      - "web/hosted_tower_asgi.py"
      - "deploy/hosted_tower/official_catalyst_one_shot.py"
      - "deploy/hosted_tower/start.sh"
      - "deploy/hosted_tower/requirements.txt"
      - "web/static/ob/ob_official_catalyst_radar.js"
      - "web/templates/**"
      - "tower/ob_market_data_desk_integration.py"
      - "tower/ob_keyed_provider_research.py"
      - "tower/ob_route_guard.py"
      - "tower/ob_web_route_enforcement.py"
      - "tower/tower_human_login_ob_launch.py"
      - "tests/test_ob_official_catalyst_radar.py"
      - "tests/test_ob_observatory_event_stream.py"
      - ".github/workflows/ob-official-catalyst-radar.yml"
  push:
    branches:
      - tower-hosted-runtime-identity-twr081-085
    paths:
      - "engine/market_intake/official_catalyst_sources.py"
      - "engine/market_intake/official_catalyst_radar.py"
      - "engine/market_intake/official_catalyst_intelligence.py"
      - "engine/market_intake/official_catalyst_fingerprint.py"
      - "engine/market_intake/observatory_event_stream.py"
      - "engine/market_intake/observatory_grpc_contract.py"
      - "proto/observatory_event_v1.proto"
      - "web/ob_event_trace_route.py"
      - "web/static/ob/ob_event_trace.js"
      - "tests/test_ob_observatory_grpc_contract.py"
      - "tests/test_ob_event_trace_route.py"
      - "tests/test_tower_ob_keyed_provider_research.py"
      - "web/ob_official_catalyst_route.py"
      - "web/ob_event_websocket.py"
      - "web/hosted_tower_asgi.py"
      - "deploy/hosted_tower/official_catalyst_one_shot.py"
      - "deploy/hosted_tower/start.sh"
      - "deploy/hosted_tower/requirements.txt"
      - "web/static/ob/ob_official_catalyst_radar.js"
      - "tower/**"
      - "tests/test_ob_official_catalyst_radar.py"
      - "tests/test_ob_observatory_event_stream.py"
      - ".github/workflows/ob-official-catalyst-radar.yml"
permissions:
  contents: read
jobs:
  synthetic-source-and-rights:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<10" flask asgiref uvicorn "websockets>=12,<16" "grpcio-tools>=1.66,<2"
      - name: Source syntax and typed owner UI
        run: |
          python -m compileall -q engine/market_intake/official_catalyst_sources.py engine/market_intake/official_catalyst_radar.py engine/market_intake/official_catalyst_intelligence.py engine/market_intake/official_catalyst_fingerprint.py engine/market_intake/observatory_event_stream.py engine/market_intake/observatory_grpc_contract.py tower/ob_keyed_provider_research.py tower/ob_market_data_desk_integration.py tower/ob_route_guard.py tower/ob_web_route_enforcement.py web/ob_official_catalyst_route.py web/ob_event_trace_route.py web/ob_event_websocket.py web/hosted_tower_asgi.py deploy/hosted_tower/official_catalyst_one_shot.py
          python -m grpc_tools.protoc -I proto --python_out=/tmp --grpc_python_out=/tmp proto/observatory_event_v1.proto
          bash -n deploy/hosted_tower/start.sh
          node --check web/static/ob/ob_official_catalyst_radar.js
          node --check web/static/ob/ob_event_trace.js
      - name: Synthetic source, attribution, rights, Soulaana and Tower enforcement
        run: |
          python -m pytest -q tests/test_ob_official_catalyst_radar.py tests/test_ob_observatory_event_stream.py tests/test_ob_observatory_grpc_contract.py tests/test_ob_event_trace_route.py tests/test_ob_alpaca_iex_stream.py tests/test_ob_keyless_public_context.py tests/test_tower_ob_keyed_provider_research.py tests/test_tower_ob_market_data_desk_selective.py tests/test_tower_ob_web_route_enforcement.py
      - name: No direct browser data calls or order transport
        run: |
          ! grep -Ei 'place_order|submit_order|innerHTML|api\.eia\.gov|api\.weather\.gov/alerts/active' web/static/ob/ob_official_catalyst_radar.js
