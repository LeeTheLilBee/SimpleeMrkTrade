name: OBSIM096-100 anonymous source activation diagnostics
on:
  push:
    branches:
      - 'obsim096-100-*'
  pull_request:
    branches:
      - 'tower-hosted-runtime-identity-twr081-085'
    paths:
      - 'scripts/ob_hosted_anonymous_release_probe.py'
      - 'scripts/ob_anonymous_two_host_inventory.py'
      - 'tests/test_obsim096_100_anonymous_source_config_diagnostics.py'
      - 'docs/owner_experience/OBSIM096_100_ANONYMOUS_SOURCE_CONFIGURATION.md'
      - '.github/workflows/obsim096-100-anonymous-source-config.yml'
permissions:
  contents: read
jobs:
  source-only-passive-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Compile passive scripts
        run: python -m py_compile scripts/ob_hosted_anonymous_release_probe.py scripts/ob_anonymous_two_host_inventory.py
      - name: Passive compatibility and behavioral source spoof regressions
        run: |
          python -m pytest -q tests/test_obsim066_070_anonymous_release_probe.py tests/test_obsim071_075_two_host_anonymous_inventory.py tests/test_obsim081_085_anonymous_final_evidence_denial.py tests/test_obsim091_095_hosted_readiness_manifest.py tests/test_obsim096_100_anonymous_source_config_diagnostics.py
