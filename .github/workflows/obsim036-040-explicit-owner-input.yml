name: OBSIM036-040 strict local owner rehearsal bridge
on:
  push:
    branches:
      - 'obsim036-040-*'
  pull_request:
    branches:
      - 'obsim016-020-free-on-demand-session'
    paths:
      - 'web/ob_explicit_owner_rehearsal_input.py'
      - 'tests/test_obsim036_040_explicit_owner_rehearsal_input.py'
      - '.github/workflows/obsim036-040-explicit-owner-input.yml'
permissions:
  contents: read
jobs:
  explicit-owner-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Compile and focused owner input, time, archive, replay regressions
        run: |
          python -m py_compile web/ob_explicit_owner_rehearsal_input.py tests/test_obsim036_040_explicit_owner_rehearsal_input.py
          python -m pytest -q tests/test_obsim036_040_explicit_owner_rehearsal_input.py tests/test_obsim031_035_private_archive_read_verification.py tests/test_obsim026_030_source_freshness_and_owner_due.py tests/test_obsim016_020_on_demand_session.py tests/test_obsim006_010_deterministic_replay.py tests/test_obtime001_005_canonical_market_time_authority.py
      - name: Complete repository suite
        run: python -m pytest -q tests
