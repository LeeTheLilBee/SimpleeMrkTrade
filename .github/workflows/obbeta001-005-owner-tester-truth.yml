name: OBBETA001-005 owner/tester truth and Tower source guard
on:
  push:
    branches:
      - 'ob-beta-owner-tester-truth-*'
  pull_request:
    paths:
      - 'web/static/ob/ob_beta_readiness.js'
      - 'tests/test_obbeta001_005_owner_tester_truth.py'
      - 'ob_evidence/manual_live/obbeta001_005_owner_tester_boundary_handoff.md'
      - '.github/workflows/obbeta001-005-owner-tester-truth.yml'
permissions:
  contents: read
jobs:
  owner-beta-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing OB dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: JS syntax
        run: node --check web/static/ob/ob_beta_readiness.js
      - name: Beta/Tower source regression
        run: |
          python -m py_compile tests/test_obbeta001_005_owner_tester_truth.py
          python -m pytest -q tests/test_obbeta001_005_owner_tester_truth.py tests/test_obml016_020_tower_namespace_cross_check.py tests/test_obml011_015_owner_beta_gate_report.py tests/test_obml_tower_account_namespace_interop.py tests/test_ob_dual_dashboard_replacement_obux091_095.py
      - name: Complete repository regression
        run: python -m pytest -q tests
