name: OBREV001-005 owner decision evidence
on:
  push:
    branches:
      - 'obrev001-005-*'
  pull_request:
    paths:
      - 'web/ob_owner_review_evidence.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obrev001_005_owner_decision_evidence.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - '.github/workflows/obrev001-005-review.yml'
permissions:
  contents: read
jobs:
  owner-review-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Syntax and focused owner review
        run: |
          python -m py_compile web/ob_owner_review_evidence.py tests/test_obrev001_005_owner_decision_evidence.py
          python -m pytest -q tests/test_obrev001_005_owner_decision_evidence.py tests/test_obrec001_005_owner_recommendation_review.py tests/test_obsafe001_005_bound_source_review.py tests/test_obauth001_005_canonical_authority_registry.py
      - name: Full repository regression
        run: python -m pytest -q tests
