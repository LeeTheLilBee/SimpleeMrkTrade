name: OB hosted one-shot no-key source proof

on:
  pull_request:
    branches:
      - tower-hosted-runtime-identity-twr081-085
    paths:
      - "deploy/hosted_tower/keyless_one_shot_source_probe.py"
      - "deploy/hosted_tower/start.sh"
      - "tests/test_ob_keyless_one_shot_source_probe.py"
      - ".github/workflows/ob-keyless-one-shot-proof.yml"
  push:
    branches:
      - tower-hosted-runtime-identity-twr081-085
    paths:
      - "deploy/hosted_tower/keyless_one_shot_source_probe.py"
      - "deploy/hosted_tower/start.sh"
      - "tests/test_ob_keyless_one_shot_source_probe.py"
      - ".github/workflows/ob-keyless-one-shot-proof.yml"
permissions:
  contents: read
jobs:
  synthetic-one-shot-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install "pytest>=8,<10" flask
      - name: Shell syntax and Python syntax
        run: |
          bash -n deploy/hosted_tower/start.sh
          python -m compileall -q deploy/hosted_tower/keyless_one_shot_source_probe.py
      - name: Truth-only probe and existing keyless regression (offline)
        run: |
          python -m pytest -q tests/test_ob_keyless_one_shot_source_probe.py tests/test_ob_keyless_public_context.py
      - name: Never run provider network in pull request tests
        run: |
          ! grep -E 'from_environment\\(\\)\\.snapshot' tests/test_ob_keyless_one_shot_source_probe.py
