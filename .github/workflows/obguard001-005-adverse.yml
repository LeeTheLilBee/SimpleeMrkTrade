name: OBGUARD001-005 distinct adverse source review
on:
  push:
    branches:
      - 'obguard001-005-*'
  pull_request:
    paths:
      - 'web/ob_adverse_guard_review.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obguard001_005_distinct_source_adverse_review.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - '.github/workflows/obguard001-005-adverse.yml'
permissions:
  contents: read
jobs:
  non-actuating-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Syntax and focused source-distinct adverse review
        run: |
          python -m py_compile web/ob_adverse_guard_review.py tests/test_obguard001_005_distinct_source_adverse_review.py
          python -m pytest -q tests/test_obguard001_005_distinct_source_adverse_review.py tests/test_oblearn001_005_bounded_review_feedback.py tests/test_obrev001_005_owner_decision_evidence.py tests/test_obauth001_005_canonical_authority_registry.py
      - name: Full repository regression
        run: python -m pytest -q tests
