name: OBCAP001-005 source-bound capital truth
on:
  push:
    branches:
      - 'obcap001-005-*'
    paths:
      - 'web/ob_capital_truth.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obcap001_005_source_bound_capital_truth.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - 'tests/test_obevent001_010_command_event_causal.py'
      - '.github/workflows/obcap001-005-source-truth.yml'
  pull_request:
    paths:
      - 'web/ob_capital_truth.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obcap001_005_source_bound_capital_truth.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - 'tests/test_obevent001_010_command_event_causal.py'
      - '.github/workflows/obcap001-005-source-truth.yml'
permissions:
  contents: read
jobs:
  source-bound-capital:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install complete repository test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Capital syntax wall
        run: python -m py_compile web/ob_capital_truth.py tests/test_obcap001_005_source_bound_capital_truth.py
      - name: Focused source/authority/event wall
        run: |
          python -m pytest -q \
            tests/test_obcap001_005_source_bound_capital_truth.py \
            tests/test_obauth001_005_canonical_authority_registry.py \
            tests/test_obevent001_010_command_event_causal.py
      - name: Full repository regression wall
        run: python -m pytest -q tests
