name: OBATTN001-005 owner attention
on:
  push:
    branches:
      - 'obattn001-005-*'
  pull_request:
    paths:
      - 'web/ob_owner_attention.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obattn001_005_owner_attention.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - '.github/workflows/obattn001-005-attention.yml'
permissions:
  contents: read
jobs:
  canonical-owner-attention:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Syntax and focused source attention
        run: |
          python -m py_compile web/ob_owner_attention.py tests/test_obattn001_005_owner_attention.py
          python -m pytest -q tests/test_obattn001_005_owner_attention.py tests/test_obsoul001_005_source_bound_explanations.py tests/test_obguard001_005_distinct_source_adverse_review.py tests/test_obauth001_005_canonical_authority_registry.py
      - name: Full repository regression
        run: python -m pytest -q tests
