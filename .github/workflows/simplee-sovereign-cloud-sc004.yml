name: Simplee Sovereign Cloud SC004 signed grant source checks

on:
  push:
    branches:
      - simplee-cloud-sc004-signed-grant-contract
  # Historical specialist check: full package PR regression is consolidated.
  pull_request:
    paths:
      - '.github/workflows/simplee-sovereign-cloud-sc004.yml'
      - 'docs/SIMPLEE_SOVEREIGN_CLOUD_SC004_SIGNED_GRANT_HANDOFF.md'

permissions:
  contents: read

jobs:
  source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependencies
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - name: Compile Cloud source contracts and regression tests
        run: |
          python -m py_compile simplee_cloud/__init__.py simplee_cloud/contracts.py simplee_cloud/service.py simplee_cloud/local_backend.py simplee_cloud/backup.py simplee_cloud/journal.py simplee_cloud/operations.py simplee_cloud/s3_backend.py simplee_cloud/provider_review.py simplee_cloud/tower_grants.py simplee_cloud/tests/test_sc001_storage.py simplee_cloud/tests/test_sc001_backup.py simplee_cloud/tests/test_sc002_operations.py simplee_cloud/tests/test_sc003_provider.py simplee_cloud/tests/test_sc004_tower_grants.py
      - name: Run synthetic SC001-SC004 tests only
        run: |
          python -m pytest -q simplee_cloud/tests/test_sc001_storage.py simplee_cloud/tests/test_sc001_backup.py simplee_cloud/tests/test_sc002_operations.py simplee_cloud/tests/test_sc003_provider.py simplee_cloud/tests/test_sc004_tower_grants.py
