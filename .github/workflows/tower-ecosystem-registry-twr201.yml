name: Tower ecosystem registry TWR201
on:
  push:
    branches:
      - tower-ecosystem-buybox-registry-twr201
  pull_request:
    paths:
      - 'tower/app_registry.py'
      - 'tests/test_tower_buybox_registry_boundary_twr201.py'
      - 'docs/TOWER_ECOSYSTEM_RECONCILIATION_TWR201.md'
      - '.github/workflows/tower-ecosystem-registry-twr201.yml'
permissions:
  contents: read
jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -r deploy/hosted_tower/requirements.txt pytest
      - name: Registry, truth, publication, and BuyBox default-deny regressions
        run: |
          python -m pytest -q             tests/test_tower_buybox_registry_boundary_twr201.py             tests/test_tower_app_registry_security_map.py             tests/test_tower_authoritative_truth_contract_twr121_125.py             tests/test_tower_authoritative_app_publication_availability_twr141_145.py
