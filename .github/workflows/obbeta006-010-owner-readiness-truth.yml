name: OBBETA006-010 owner practice readiness truth
on:
  push:
    branches:
      - 'ob-beta-owner-readiness-truth-*'
  pull_request:
    paths:
      - 'web/static/ob/ob_owner_dashboard_contract.js'
      - 'web/static/ob/ob_owner_dashboard.js'
      - 'tests/test_obbeta006_010_owner_readiness_truth.py'
      - 'ob_evidence/manual_live/obbeta006_010_owner_dashboard_readiness_truth_handoff.md'
      - '.github/workflows/obbeta006-010-owner-readiness-truth.yml'
permissions:
  contents: read
jobs:
  owner-dashboard-practice-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing OB dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: JS syntax
        run: |
          node --check web/static/ob/ob_owner_dashboard_contract.js
          node --check web/static/ob/ob_owner_dashboard.js
          node --check web/static/ob/ob_beta_readiness.js
      - name: Owner readiness and Tower source regressions
        run: |
          python -m py_compile tests/test_obbeta006_010_owner_readiness_truth.py
          python -m pytest -q tests/test_obbeta006_010_owner_readiness_truth.py tests/test_obbeta001_005_owner_tester_truth.py tests/test_ob_dual_dashboard_replacement_obux091_095.py tests/test_obml016_020_tower_namespace_cross_check.py tests/test_obml011_015_owner_beta_gate_report.py
      - name: Complete repository regression
        run: python -m pytest -q tests
