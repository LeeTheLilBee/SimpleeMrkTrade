name: Tower OB verification continuity

on:
  pull_request:
    branches:
      - tower-hosted-runtime-identity-twr081-085
    paths:
      - "tower/tower_human_login_ob_launch.py"
      - "tower/owner_observatory_handoff.py"
      - "tower/ob_web_route_enforcement.py"
      - "tower/test_tower_human_login_ob_launch.py"
      - "tests/test_tower_ob_web_route_enforcement.py"
      - "tests/test_obsim056_060_hosted_owner_rehearsal.py"
      - "tests/test_ob_public_owner_connection.py"
      - ".github/workflows/tower-ob-verification-continuity.yml"
  push:
    branches:
      - tower-hosted-runtime-identity-twr081-085
    paths:
      - "tower/tower_human_login_ob_launch.py"
      - "tower/owner_observatory_handoff.py"
      - "tower/ob_web_route_enforcement.py"
      - "tower/test_tower_human_login_ob_launch.py"
      - "tests/test_tower_ob_web_route_enforcement.py"
      - "tests/test_obsim056_060_hosted_owner_rehearsal.py"
      - "tests/test_ob_public_owner_connection.py"
      - ".github/workflows/tower-ob-verification-continuity.yml"

permissions:
  contents: read

jobs:
  fresh-session-ob-rebind:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r deploy/hosted_tower/requirements.txt "pytest>=8,<10"
      - name: Compile affected Tower modules
        run: python -m compileall -q tower/tower_human_login_ob_launch.py tower/owner_observatory_handoff.py tower/ob_web_route_enforcement.py
      - name: Verify logout/login rebind and protected route continuity
        run: |
          python -m pytest -q tower/test_tower_human_login_ob_launch.py::test_fresh_login_to_private_ob_rebuilds_verification tests/test_tower_ob_web_route_enforcement.py tests/test_obsim056_060_hosted_owner_rehearsal.py tests/test_ob_public_owner_connection.py
