name: OBSIM011-015 adverse historical replay
on:
  push:
    branches:
      - 'obsim011-015-*'
  pull_request:
    paths:
      - 'tests/test_obsim011_015_adverse_scenario_regressions.py'
      - '.github/workflows/obsim011-015-adverse.yml'
permissions:
  contents: read
jobs:
  adverse-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Syntax and focused adverse replay
        run: |
          python -m py_compile tests/test_obsim011_015_adverse_scenario_regressions.py
          python -m pytest -q tests/test_obsim001_005_multi_simulation_harness.py tests/test_obsim006_010_deterministic_replay.py tests/test_obsim011_015_adverse_scenario_regressions.py
      - name: Complete regression wall
        run: python -m pytest -q tests
