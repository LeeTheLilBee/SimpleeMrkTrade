name: Simplee Sovereign Cloud SC005B durable backup source checks

on:
  push:
    branches:
      - simplee-cloud-sc005b-backup-idempotency
  # Historical specialist check: full package PR regression is consolidated.
  pull_request:
    paths:
      - '.github/workflows/simplee-sovereign-cloud-sc005b.yml'
      - 'docs/SIMPLEE_SOVEREIGN_CLOUD_SC005B_DURABLE_BACKUP.md'

permissions:
  contents: read

jobs:
  backup-source-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic test dependencies only
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - name: Compile Cloud package and source regression tests
        run: python -m compileall -q simplee_cloud
      - name: Run SC001-SC005B source regression tests
        run: python -m pytest -q simplee_cloud/tests/
