name: TWR-OBML source-only account namespace receipt verification
on:
  push:
    branches:
      - 'twr-obml-account-namespace-source-verifier'
  pull_request:
    paths:
      - 'tower/obml_account_namespace_source.py'
      - 'tests/test_tower_obml_account_namespace_source.py'
      - 'docs/TOWER_OBML_ACCOUNT_NAMESPACE_SOURCE_HANDOFF.md'
      - '.github/workflows/tower-obml-account-namespace-source.yml'
permissions:
  contents: read
jobs:
  account-namespace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Compile and test source-only Tower account namespace boundary
        run: |
          python -m py_compile tower/obml_account_namespace_source.py tests/test_tower_obml_account_namespace_source.py
          python -m pytest -q tests/test_tower_obml_account_namespace_source.py tests/test_obml001_005_owner_manual_source_preflight.py tests/test_obml006_010_tower_contract_inspection.py tests/test_obml011_015_owner_beta_gate_report.py tests/test_obauth006_010_account_identity_truth.py
      - name: Full repository regression
        run: python -m pytest -q tests
