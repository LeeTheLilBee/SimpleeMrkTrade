name: OBSIM046-050 loopback owner rehearsal browser acceptance
on:
  push:
    branches:
      - 'obsim046-050-*'
  pull_request:
    branches:
      - 'obsim016-020-free-on-demand-session'
    paths:
      - 'web/ob_local_owner_rehearsal_ui.py'
      - 'web/templates/local_owner_rehearsal.html'
      - 'web/static/ob/ob_local_owner_rehearsal.js'
      - 'web/static/ob/ob_local_owner_rehearsal.css'
      - 'scripts/ob_local_owner_rehearsal_web.py'
      - 'tests/test_obsim046_050_loopback_owner_rehearsal_ui.py'
      - '.github/workflows/obsim046-050-loopback-owner-web.yml'
permissions:
  contents: read
jobs:
  private-loopback:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Compile + browser script syntax
        run: |
          python -m py_compile web/ob_local_owner_rehearsal_ui.py scripts/ob_local_owner_rehearsal_web.py tests/test_obsim046_050_loopback_owner_rehearsal_ui.py
          node --check web/static/ob/ob_local_owner_rehearsal.js
          python -m json.tool examples/obsim_owner_synthetic_hold_example.json > /dev/null
      - name: Focused HTTP, manual owner input and private archive tests
        run: |
          python -m pytest -q tests/test_obsim046_050_loopback_owner_rehearsal_ui.py tests/test_obsim041_045_local_terminal_owner_rehearsal.py tests/test_obsim036_040_explicit_owner_rehearsal_input.py tests/test_obsim031_035_private_archive_read_verification.py tests/test_obsim026_030_source_freshness_and_owner_due.py
      - name: Full repository regression
        run: python -m pytest -q tests
