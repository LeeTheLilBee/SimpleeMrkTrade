name: Tower BuyBox exact owner-handoff interop TWR207-211

on:
  push:
    branches:
      - tower-buybox-wire-contract-twr207-211
  pull_request:
    paths:
      - 'tower/buybox_handoff_wire.py'
      - 'tests/test_tower_buybox_wire_interop_twr207_211.py'
      - 'docs/TOWER_BUYBOX_WIRE_TWR207_211.md'
      - '.github/workflows/tower-buybox-wire-twr207-211.yml'

permissions:
  contents: read

jobs:
  cross-system-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact independently sealed BuyBox receiver
        uses: actions/checkout@v4
        with:
          repository: LeeTheLilBee/SimpleeMrkTrade
          ref: 3e265c79f61c02ba149c53734757d8d9fd501608
          path: receiver-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tower dependencies and pytest
        run: |
          python -m pip install -r deploy/hosted_tower/requirements.txt pytest
      - name: Exact source-to-source HMAC interoperability and old default deny
        run: |
          python -m pytest -q \
            tests/test_tower_buybox_wire_interop_twr207_211.py \
            tests/test_tower_buybox_action_contract_twr202_206.py \
            tests/test_tower_buybox_registry_boundary_twr201.py \
            tests/test_tower_app_registry_security_map.py
