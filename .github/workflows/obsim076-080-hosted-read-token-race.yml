name: OBSIM076-080 owner hosted read token rotation
on:
  push:
    branches:
      - obsim076-080-hosted-read-token-race
  pull_request:
    branches:
      - tower-hosted-runtime-identity-twr081-085
    paths:
      - 'tower/ob_hosted_owner_rehearsal.py'
      - 'tests/test_obsim076_080_hosted_read_token_race.py'
      - '.github/workflows/obsim076-080-hosted-read-token-race.yml'
permissions:
  contents: read
jobs:
  hosted-read-token:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install current Tower test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Focused deterministic Tower HTTP and source regressions
        run: |
          python -m py_compile tower/ob_hosted_owner_rehearsal.py tests/test_obsim076_080_hosted_read_token_race.py
          python -m pytest -q tests/test_obsim076_080_hosted_read_token_race.py tests/test_obsim061_065_hosted_token_lifecycle.py tests/test_obsim056_060_hosted_owner_rehearsal.py tests/test_tower_ob_web_route_enforcement.py tests/test_obsim066_070_anonymous_release_probe.py tests/test_obsim071_075_two_host_anonymous_inventory.py
      - name: Rehearsal source and report integrity regressions
        run: |
          python -m pytest -q tests/test_obsim016_020_on_demand_session.py tests/test_obsim021_025_local_report_no_clobber.py tests/test_obsim026_030_source_freshness_and_owner_due.py tests/test_obsim031_035_private_archive_read_verification.py tests/test_obsim036_040_explicit_owner_rehearsal_input.py
