name: OBSIM056-060 Tower protected hosted synthetic rehearsal
on:
  push:
    branches:
      - 'tower-ob-hosted-rehearsal-adapter-0927'
  pull_request:
    branches:
      - 'tower-ob-obsim-source-unification-0927'
permissions:
  contents: read
jobs:
  hosted-owner-negative:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Compile strict hosted adapter and browser
        run: |
          python -m py_compile tower/ob_hosted_owner_rehearsal.py tests/test_obsim056_060_hosted_owner_rehearsal.py
          node --check web/static/ob/ob_hosted_owner_rehearsal.js
      - name: Real hosted HTTP negative and accepted source simulation tests
        run: |
          python -m pytest -q tests/test_obsim056_060_hosted_owner_rehearsal.py tests/test_obsim016_020_on_demand_session.py tests/test_obsim021_025_local_report_no_clobber.py tests/test_obsim026_030_source_freshness_and_owner_due.py tests/test_obsim031_035_private_archive_read_verification.py tests/test_obsim036_040_explicit_owner_rehearsal_input.py tests/test_obsim041_045_local_terminal_owner_rehearsal.py tests/test_obsim046_050_loopback_owner_rehearsal_ui.py tests/test_obsim051_055_source_release_isolation.py tests/test_tower_ob_web_route_enforcement.py
      - name: Auth, product doorway and hosted startup regression
        run: |
          python -m pytest -q tests/test_tower_human_login_ob_native_launch.py tests/test_tower_ob_web_route_enforcement.py tests/test_tower_ob_product_landing_twr178_180.py
