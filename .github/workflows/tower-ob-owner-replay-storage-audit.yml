name: Tower OB handoff replay storage source audit TWR-OBML031-035

on:
  push:
    branches:
      - tower-ob-hosted-replay-storage-audit-twr-obml031-035
  pull_request:
    paths:
      - 'tower/ob_owner_replay_storage_audit.py'
      - 'tests/test_tower_ob_owner_replay_storage_audit_twr_obml031_035.py'
      - 'docs/TOWER_OBML_REPLAY_STORAGE_AUDIT_TWR031_035.md'
      - '.github/workflows/tower-ob-owner-replay-storage-audit.yml'

permissions:
  contents: read

jobs:
  source-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Tower and test requirements
        run: |
          python -m pip install -r deploy/hosted_tower/requirements.txt pytest tzdata flask requests yfinance
      - name: Verify storage gap remains visible and hosted source diagnostics fail closed
        run: |
          python -m pytest -q \
            tests/test_tower_ob_owner_replay_storage_audit_twr_obml031_035.py \
            tests/test_obsim091_095_hosted_readiness_manifest.py \
            tests/test_obsim056_060_hosted_owner_rehearsal.py
