name: Simplee Cloud SC014 owner-safe source status

on:
  push:
    branches:
      - simplee-cloud-sc014-owner-safe-status
  # Historical specialist check: full package PR regression is consolidated.
  pull_request:
    paths:
      - '.github/workflows/simplee-cloud-sc014-owner-source-status.yml'
      - 'docs/SIMPLEE_SOVEREIGN_CLOUD_SC014_OWNER_SOURCE_STATUS.md'

permissions:
  contents: read

jobs:
  source-owner-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AWS_EC2_METADATA_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only dependencies
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - name: Compile Cloud source and merged Vault protocol
        run: |
          python -m compileall -q simplee_cloud
          python -m py_compile vault/real_operations_encrypted_storage.py
      - name: Run full Cloud source regression
        run: python -m pytest -q simplee_cloud/tests/
      - name: Publish production HOLD evidence list
        if: always()
        run: python -m simplee_cloud.owner_preflight >> "$GITHUB_STEP_SUMMARY"
