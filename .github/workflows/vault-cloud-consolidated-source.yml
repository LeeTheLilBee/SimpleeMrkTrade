name: Integrated Vault and Sovereign Cloud source acceptance

on:
  push:
    branches:
      - vault-cloud-consolidated-source-ci-0927
  pull_request:
    branches:
      - vault-dev
    paths:
      - 'vault/**'
      - 'simplee_cloud/**'
      - 'tower/buybox_evidence_handoff.py'
      - 'tower/test_buybox_evidence_handoff.py'
      - '.github/workflows/vault-cloud-consolidated-source.yml'

permissions:
  contents: read

jobs:
  source-only-all-corridors:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pin independent reviewed Cloud contract reference for Vault interoperability
        uses: actions/checkout@v4
        with:
          repository: LeeTheLilBee/SimpleeMrkTrade
          ref: 7b973ca80d1ec340131cd4b097ddc14e0d04f2d2
          path: cloud-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install synthetic source dependencies
        run: python -m pip install 'pytest>=8,<10' 'cryptography>=44,<47'
      - name: Compile Vault and separate Sovereign Cloud packages
        run: |
          python -m compileall -q vault simplee_cloud
          python -m py_compile tower/buybox_evidence_handoff.py
      - name: Run whole combined local crypto/registry/journal/evidence/recovery wall
        run: |
          python -m pytest -q \
            vault/test_real_operations_encrypted_storage.py \
            vault/test_real_operations_managed_object_store.py \
            vault/test_canonical_evidence_registry.py \
            vault/test_canonical_evidence_registry_cloud_ref.py \
            vault/test_buybox_evidence_handoff_contract.py \
            vault/test_buybox_evidence_lineage_registry.py \
            tower/test_buybox_evidence_handoff.py \
            vault/test_archival_transaction_journal.py \
            vault/test_archival_transaction_journal_security.py \
            vault/test_local_archival_integration.py \
            vault/test_retention_governance.py \
            vault/test_integrity_report.py \
            simplee_cloud/tests
