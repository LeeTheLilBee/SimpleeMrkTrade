name: OBPORT001-005 isolated portfolio view
on:
  push:
    branches:
      - 'obport001-005-*'
  pull_request:
    paths:
      - 'web/ob_portfolio_view.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obport001_005_source_bound_lane_portfolio.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - '.github/workflows/obport001-005-portfolio.yml'
permissions:
  contents: read
jobs:
  read-only-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Syntax and focused source portfolios
        run: |
          python -m py_compile web/ob_portfolio_view.py tests/test_obport001_005_source_bound_lane_portfolio.py
          python -m pytest -q tests/test_obport001_005_source_bound_lane_portfolio.py tests/test_obpos001_005_source_bound_position_view.py tests/test_obauth001_005_canonical_authority_registry.py tests/test_obevent001_010_command_event_causal.py
      - name: Complete repository regression
        run: python -m pytest -q tests
