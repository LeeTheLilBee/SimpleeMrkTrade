name: BuyBox foundation
on:
  pull_request:
    paths:
      - 'buybox/**'
      - '.github/workflows/buybox-foundation.yml'
  push:
    branches:
      - 'buybox-universal-acquisition-foundation-bbx001'
    paths:
      - 'buybox/**'
      - '.github/workflows/buybox-foundation.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install BuyBox runtime dependencies
        run: python -m pip install -r buybox/requirements.txt
      - name: Fetch canonical Tower–Vault proof contract from reviewed PR #35 commit
        uses: actions/checkout@v4
        with:
          ref: 1b9a3e191cf8f8b61adb59b790033983f767f42f
          path: upstream-proof
          persist-credentials: false
      - name: Verify BuyBox and exact PR35 metadata-schema compatibility
        env:
          BUYBOX_CANONICAL_CONTRACT_PATH: upstream-proof/vault/buybox_evidence_handoff_contract.py
        run: python -m unittest discover -s buybox/tests -v
