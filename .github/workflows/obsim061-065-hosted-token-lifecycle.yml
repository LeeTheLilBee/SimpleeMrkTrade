name: OBSIM061-065 hosted reset token lifecycle and strict default hold
on:
  push:
    branches:
      - 'obsim061-065-*'
  pull_request:
    branches:
      - 'tower-hosted-runtime-identity-twr081-085'
permissions:
  contents: read
jobs:
  hosted-token-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install existing repository test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Compile protected adapter and browser
        run: |
          python -m py_compile tower/ob_hosted_owner_rehearsal.py tests/test_obsim056_060_hosted_owner_rehearsal.py tests/test_obsim061_065_hosted_token_lifecycle.py
          node --check web/static/ob/ob_hosted_owner_rehearsal.js
      - name: Actual HTTP and source isolation
        run: |
          python -m pytest -q tests/test_obsim061_065_hosted_token_lifecycle.py tests/test_obsim056_060_hosted_owner_rehearsal.py tests/test_obsim016_020_on_demand_session.py tests/test_obsim021_025_local_report_no_clobber.py tests/test_obsim026_030_source_freshness_and_owner_due.py tests/test_obsim031_035_private_archive_read_verification.py tests/test_obsim036_040_explicit_owner_rehearsal_input.py tests/test_obsim041_045_local_terminal_owner_rehearsal.py tests/test_obsim046_050_loopback_owner_rehearsal_ui.py tests/test_obsim051_055_source_release_isolation.py tests/test_tower_ob_web_route_enforcement.py
      - name: Tower hosted owner auth and runtime regression
        run: |
          python -m pytest -q tests/test_tower_human_login_ob_native_launch.py tests/test_tower_ob_web_route_enforcement.py web/test_hosted_tower_entrypoint.py
