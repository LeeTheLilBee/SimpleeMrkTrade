name: OBSOUL001-005 source-bound Soulaana explanations
on:
  push:
    branches:
      - 'obsoul001-005-*'
  pull_request:
    paths:
      - 'web/ob_soulaana_explanations.py'
      - 'web/ob_authority_registry.py'
      - 'tests/test_obsoul001_005_source_bound_explanations.py'
      - 'tests/test_obauth001_005_canonical_authority_registry.py'
      - '.github/workflows/obsoul001-005-explanations.yml'
permissions:
  contents: read
jobs:
  source-explanations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Syntax and source explanation regression
        run: |
          python -m py_compile web/ob_soulaana_explanations.py tests/test_obsoul001_005_source_bound_explanations.py
          python -m pytest -q tests/test_obsoul001_005_source_bound_explanations.py tests/test_obguard001_005_distinct_source_adverse_review.py tests/test_obrec001_005_owner_recommendation_review.py tests/test_obauth001_005_canonical_authority_registry.py
      - name: Complete repository regression
        run: python -m pytest -q tests
