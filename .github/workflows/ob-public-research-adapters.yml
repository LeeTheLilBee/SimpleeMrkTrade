name: OB public reference research adapters (offline)
on:
  push:
    branches:
      - ob-public-free-research-adapters-0929
  pull_request:
    paths:
      - 'engine/market_intake/public_research_sources.py'
      - 'engine/market_intake/provider_catalog.py'
      - 'tests/test_ob_public_research_sources.py'
      - 'scripts/ob_public_research_check.py'
      - '.github/workflows/ob-public-research-adapters.yml'
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pytest flask
      - run: python -m compileall -q engine/market_intake/public_research_sources.py scripts/ob_public_research_check.py
      - run: python -m pytest -q tests/test_ob_public_research_sources.py tests/test_obscan026_040_universal_gateway.py tests/test_tower_ob_market_data_desk_selective.py
      - name: Check no price or execution transport was added
        run: |
          ! grep -E 'broker\.place|place_order|submit_order|yfinance' engine/market_intake/public_research_sources.py
