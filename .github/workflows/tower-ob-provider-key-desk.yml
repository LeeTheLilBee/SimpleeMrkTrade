name: Tower OB general research API key desk
on:
  push:
    branches:
      - tower-ob-general-provider-keys-20260929
  pull_request:
    paths:
      - "tower/ob_provider_key_desk.py"
      - "tower/ob_market_data_desk_integration.py"
      - "tower/ob_route_guard.py"
      - "tower/ob_web_route_enforcement.py"
      - "web/templates/ob_provider_key*.html"
      - "web/templates/market_data_desk.html"
      - "web/static/ob/ob_provider_key_desk.css"
      - "tests/test_tower_ob_provider_key_desk.py"
      - ".github/workflows/tower-ob-provider-key-desk.yml"
permissions:
  contents: read
jobs:
  protected-key-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install hosted requirements and pytest
        run: python -m pip install -r deploy/hosted_tower/requirements.txt "pytest>=8,<10"
      - name: Compile source
        run: python -m py_compile tower/ob_provider_key_desk.py tower/ob_market_data_desk_integration.py tower/ob_route_guard.py tower/ob_web_route_enforcement.py
      - name: Sealed owner key form and existing protected routes
        run: |
          python -m pytest -q \
            tests/test_tower_ob_provider_key_desk.py \
            tests/test_ob_public_owner_connection.py \
            tests/test_tower_ob_market_data_desk_selective.py \
            tests/test_tower_ob_web_route_enforcement.py
      - name: No client-side credential transport or market activation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("tower/ob_provider_key_desk.py").read_text()
          t=Path("web/templates/ob_provider_key_desk.html").read_text()
          assert "getattr(request, 'url')" not in p
          assert "localStorage" not in t and "sessionStorage" not in t
          assert "type=\"password\"" in t
          assert "api_key_persisted" not in t
          assert "broker_execution" in p and "live_feed_installed" in p
          assert "OB_PROVIDER_KEY_DESK_ENABLED" in p
          PY
