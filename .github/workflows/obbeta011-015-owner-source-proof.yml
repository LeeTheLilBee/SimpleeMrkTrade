name: OBBETA011-015 owner dashboard verified-source truth
on:
  push:
    branches:
      - 'obbeta011-015-*'
    paths:
      - 'web/static/ob/ob_owner_dashboard_contract.js'
      - 'tests/test_obbeta011_015_owner_source_proof_labels.js'
      - '.github/workflows/obbeta011-015-owner-source-proof.yml'
  pull_request:
    paths:
      - 'web/static/ob/ob_owner_dashboard_contract.js'
      - 'tests/test_obbeta011_015_owner_source_proof_labels.js'
      - 'docs/owner_experience/OBBETA011_015_OWNER_SOURCE_PROOF_LABELS.md'
      - '.github/workflows/obbeta011-015-owner-source-proof.yml'
permissions:
  contents: read
jobs:
  owner-source-truth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run real JS module source-label behavioral regression
        run: |
          node --check web/static/ob/ob_owner_dashboard_contract.js
          node tests/test_obbeta011_015_owner_source_proof_labels.js
      - name: Install existing tests
        run: python -m pip install pytest tzdata flask requests yfinance
      - name: Owner UI beta and safety regressions
        run: |
          python -m pytest -q tests/test_obbeta001_005_owner_tester_truth.py tests/test_obbeta006_010_owner_readiness_truth.py tests/test_owner_dashboard_obux021_contract.py tests/test_owner_dashboard_obux024_owner_intelligence.py
      - name: Complete repository regression
        run: python -m pytest -q tests
